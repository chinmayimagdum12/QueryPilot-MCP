[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "querypilot-mcp"
version = "0.1.0"
description = "PostgreSQL Read-Only Analyst MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.2.0,<2",
  "psycopg[binary]>=3.1.0",
  "sqlglot>=25.0.0",
  "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
querypilot = "querypilot.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/querypilot"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
