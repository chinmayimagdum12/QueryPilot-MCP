name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pagila
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://querypilot_ro:change_me_local_only@localhost:5432/pagila
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint and format check
        run: ruff check .

      - name: Load sample database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in db/init/*.sql; do
            echo "Applying $f..."
            PGPASSWORD=postgres psql -h localhost -U postgres -d pagila -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run test suite with coverage
        run: pytest --cov=src/querypilot --cov-report=term-missing --cov-fail-under=80
